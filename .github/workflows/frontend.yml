name: Frontend CI

on:
  push:
    paths:
      - "hims-frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "hims-frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: hims-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hims-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
